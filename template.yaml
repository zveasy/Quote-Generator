AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pawsitive Impact Pet Care internal Quote Studio
Parameters:
  AdminEmail:
    Type: String
    AllowedPattern: '^[^@ ]+@[^@ ]+\.[^@ ]+$'
  BusinessTimezone:
    Type: String
    Default: America/New_York
  EnableStats:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
Conditions:
  StatsEnabled: !Equals [!Ref EnableStats, 'true']
Resources:
  Records:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
  Stats:
    Type: AWS::S3::Bucket
    Condition: StatsEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
  Pool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  Client:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Pool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      TokenValidityUnits: {AccessToken: hours}
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [email, name]
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
  Http:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings: {ThrottlingBurstLimit: 40, ThrottlingRateLimit: 20}
  Studio:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: app.handler
      CodeUri: .package/
      MemorySize: 256
      Timeout: 20
      Environment:
        Variables:
          TABLE_NAME: !Ref Records
          ADMIN_EMAIL: !Ref AdminEmail
          BUSINESS_TZ: !Ref BusinessTimezone
          CLIENT_ID: !Ref Client
          POOL_ID: !Ref Pool
          STATS_BUCKET: !If [StatsEnabled, !Ref Stats, '']
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:Query']
              Resource: !GetAtt Records.Arn
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !GetAtt Pool.Arn
            - !If
              - StatsEnabled
              - {Effect: Allow, Action: 's3:PutObject', Resource: !Sub '${Stats.Arn}/stats/*'}
              - !Ref AWS::NoValue
      Events:
        Index: {Type: HttpApi, Properties: {ApiId: !Ref Http, Path: /, Method: GET}}
        Proxy: {Type: HttpApi, Properties: {ApiId: !Ref Http, Path: '/{proxy+}', Method: ANY}}
Outputs:
  WorkspaceUrl:
    Value: !Sub 'https://${Http}.execute-api.${AWS::Region}.${AWS::URLSuffix}/'
